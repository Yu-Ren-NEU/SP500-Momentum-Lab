name: Monthly data refresh
on:
  schedule:
    # First day of each month, 11:17 Asia/Shanghai (03:17 UTC).
    - cron: '17 3 1 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monthly-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Fetch and validate licensed public observations in staging
        run: python3 scripts/monthly_update.py
      - name: Verify calculations, UI and production build
        run: npm run check
        env:
          DEPLOY_BASE_PATH: /SP500-Momentum-Lab/
      - run: python3 scripts/check_release.py
      - name: Commit only validated public outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data data/research/top10-history.json data/research/current-year-sample.json docs/HOLDING-GAPS.csv
          if git diff --cached --quiet; then
            echo 'No data changes.' >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m 'data: refresh current-year public research sample'
            git push origin HEAD:main
            echo 'Validated public data updated; deployment follows through workflow_run.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record coverage and cutoff
        run: python3 scripts/check_release.py --summary >> "$GITHUB_STEP_SUMMARY"
